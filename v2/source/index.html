<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TourCode teaser</title>
<link rel="stylesheet" href="film.css">
</head>
<body>
<div id="stage">
  <!-- 1 · Hook -->
  <section class="scene" id="s1">
    <div class="cam">
      <div class="hook-field"></div>
    </div>
  </section>

  <!-- 2 · The command -->
  <section class="scene" id="s2">
    <div class="cam">
      <div class="prompt-card" id="prompt">
        <span class="prompt-glyph">›</span>
        <span class="prompt-text"><span class="slash"></span><span class="rest"></span></span><span class="caret"></span>
      </div>
      <svg class="route-svg" id="cmd-route" viewBox="0 0 1920 1080"></svg>
    </div>
  </section>

  <!-- 3 · The agent studies the code -->
  <section class="scene" id="s3">
    <div class="cam">
      <div class="explorer" id="explorer"></div>
      <svg class="route-svg" id="s3-route" viewBox="0 0 1920 1080"></svg>
      <div class="mapspace" id="mapspace"></div>
    </div>
  </section>

  <!-- 4 · Tour map -->
  <section class="scene" id="s4">
    <div class="cam">
      <div class="reveal-glow" id="reveal-glow"></div>
      <div class="window map-window" id="map-window">
        <div class="tabstrip"><div class="tab active"><span class="tab-icon mark"></span>How login works</div></div>
        <div class="map-body"></div>
      </div>
    </div>
  </section>

  <!-- 5 + 6 · The editor -->
  <section class="scene" id="s5">
    <div class="cam">
      <div class="window editor" id="editor">
        <div class="titlebar"><span class="dots"><i></i><i></i><i></i></span><span class="title">acme-shop</span></div>
        <div class="activity"></div>
        <div class="sidebar"><div class="view-title">TOURCODE</div><div class="stack" id="sb-stack"></div></div>
        <div class="main">
          <div class="tabs"><div class="tab active" id="code-tab"><span class="ts">TS</span><span class="name">auth.ts</span></div></div>
          <div class="crumbs" id="crumbs"></div>
          <div class="code" id="code"></div>
          <div class="panel"><div class="panel-title"><span class="active">TOURCODE</span></div><div class="stack" id="panel-stack"></div></div>
        </div>
        <div class="statusbar"><span>⎇ main</span><span class="right">TypeScript</span></div>
      </div>
      <div class="cursor" id="cursor-ed"></div>
    </div>
  </section>

  <!-- 7 · For teams -->
  <section class="scene" id="s7">
    <div class="cam">
      <div class="window side-window" id="home-window"><div class="view-title">TOURCODE</div><div class="stack" id="home-stack"></div></div>
      <div class="cursor" id="cursor-home"></div>
    </div>
  </section>

  <!-- 8 · Export -->
  <section class="scene" id="s8">
    <div class="cam">
      <div class="window side-window" id="export-window"><div class="view-title">TOURCODE</div><div class="stack" id="export-stack"></div></div>
      <svg class="route-svg" id="s8-route" viewBox="0 0 1920 1080"></svg>
      <div id="page-frame"><div class="sweep"></div></div>
      <div id="packets"></div>
      <div class="dest" id="dest"></div>
      <div class="cursor" id="cursor-export"></div>
    </div>
  </section>

  <!-- 9 · Works everywhere -->
  <section class="scene" id="s9">
    <div class="cam"><div class="rows" id="rows"></div></div>
  </section>

  <!-- 10 · Final frame -->
  <section class="scene" id="s10">
    <div class="cam">
      <div class="lockup" id="lockup">
        <svg class="logo" id="logo" viewBox="0 0 64 64">
          <circle class="logo-disc" cx="32" cy="32" r="32"/>
          <g class="logo-route" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
            <circle class="r-dot" cx="20" cy="44" r="5"/>
            <path class="r-path" d="M25 44h12a7 7 0 0 0 0-14H27a7 7 0 0 1 0-14h12"/>
            <path class="r-head" d="M37 11l5 5-5 5"/>
          </g>
        </svg>
        <div class="wordmark" id="wordmark">TourCode</div>
      </div>
      <div class="cta" id="cta"><span class="try">Try it:</span> <span class="url">github.com/RainPythonDeveloper/tourcode</span></div>
    </div>
  </section>

  <div class="xfer" id="xfer"><i></i><b></b></div>
  <div class="titles" id="titles"></div>
</div>

<script src="node_modules/gsap/dist/gsap.min.js"></script>
<script src="data/ui-css.js"></script>
<script src="data/ui-states.js"></script>
<script src="data/page-css.js"></script>
<script src="data/narration.js"></script>
<script src="data/demo.js"></script>
<script src="data/logos.js"></script>
<script src="film.js"></script>
</body>
</html>
