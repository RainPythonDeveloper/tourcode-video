(function () {
  const ID = "02-command";
  const CX = 960, CY = 540;
  const cam = (P, s, T, extra) => Object.assign({ x: T[0] - CX - s * (P[0] - CX), y: T[1] - CY - s * (P[1] - CY), scale: s }, extra || {});
  const CMD = "/tour how does login work";
  // char k typed at T[k] (natural rhythm); Enter at 3.6 (8.6 s in the film, on the beat)
  const T = [0.95, 1.03, 1.12, 1.20, 1.28, 1.40, 1.50, 1.58, 1.66, 1.78, 1.88, 1.95, 2.03, 2.12, 2.24, 2.36, 2.44, 2.52, 2.60, 2.69, 2.82, 2.94, 3.02, 3.11, 3.20];
  const CW = 9.0;                                   // JetBrains Mono 15 px advance
  const text = document.getElementById("f02-text");
  const chars = [...CMD].map((c) => { const s = document.createElement("span"); s.textContent = c; text.appendChild(s); return s; });
  // window origin (116, 41); chat at window x 1128; input at (16, 666) inside the chat; text at (16, 13)
  const TX = 116 + 1128 + 16 + 16, TY = 41 + 34 + 666 + 13 + 11;     // stage coords: text start, line middle
  const W0 = cam([960, 470], 0.98, [960, 470], { rotationY: -3, rotationX: 2 });
  const W1 = cam([TX + (CMD.length * CW) / 2, TY], 2.6, [960, 540], { rotationY: 0, rotationX: 0 });

  const tl = gsap.timeline({ paused: true });
  gsap.set("#f02-cam", W0);
  gsap.set("#f02-chat", { x: 580 });
  gsap.set(chars, { opacity: 0 });
  gsap.set("#f02-line", { scaleX: 0 });

  // ---- 0.0–0.6  the empty editor, near-silence. 0.6–1.1 the agent chat slides in
  tl.to("#f02-chat", { x: 0, duration: 0.5, ease: "expo.out" }, 0.6);
  // caret blinks while idle
  [0.0, 0.5].forEach((t) => { tl.set("#f02-caret", { opacity: 0 }, 0.6 + t + 0.25); tl.set("#f02-caret", { opacity: 1 }, 0.6 + t + 0.5); });

  // ---- 0.9–2.0  push in on the input while the command types
  tl.to("#f02-cam", Object.assign({ duration: 1.1, ease: "expo.inOut" }, W1), 0.9);
  tl.set("#f02-ph", { opacity: 0 }, T[0]);
  chars.forEach((c, k) => {
    tl.set(c, { opacity: 1 }, T[k]);
    tl.set("#f02-caret", { x: (k + 1) * CW }, T[k]);
  });
  // caret blinks again after typing
  tl.set("#f02-caret", { opacity: 0 }, 3.32);
  tl.set("#f02-caret", { opacity: 1 }, 3.5);

  // ---- 3.6  Enter: the command glows green (confirm + shimmer)
  tl.set("#f02-caret", { opacity: 0 }, 3.6);
  tl.to("#f02-text", { color: "#3fb950", textShadow: "0 0 10px rgba(63,185,80,.85)", duration: 0.25, ease: "power2.out" }, 3.6);
  tl.to("#f02-input", { borderColor: "rgba(63,185,80,.65)", boxShadow: "0 0 0 1px rgba(63,185,80,.35), 0 0 22px rgba(63,185,80,.25)", duration: 0.3, ease: "power2.out" }, 3.6);
