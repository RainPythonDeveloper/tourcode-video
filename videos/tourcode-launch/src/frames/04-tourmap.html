(function () {
  const ID = "04-tourmap";
  const CX = 960, CY = 540;

  const S1 = cam([1164, 455], 1.3, [960, 455], { rotationY: -4, rotationX: 2 });

  const tl = gsap.timeline({ paused: true });
  gsap.set("#f04-cam", S0);

  // ---- 0.0–0.6  the subway line settles into the real tour map

  tl.to("#f04-seam-line", { opacity: 0, duration: 0.35, ease: "power2.out" }, 0.3);
  // soft impact on settle (no shake): a tiny scale breath of the camera
  tl.to("#f04-cam", Object.assign({ duration: 0.16, ease: "power2.out" }, cam(N0, 2.07 * 1.012, [960, 285])), 0.6);
  tl.to("#f04-cam", Object.assign({ duration: 0.2, ease: "power2.inOut" }, S0), 0.76);
