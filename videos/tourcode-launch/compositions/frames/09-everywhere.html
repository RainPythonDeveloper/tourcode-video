<script>
(function () {
  const ID = "09-everywhere";
  const tl = gsap.timeline({ paused: true });
  const tiles = [...document.querySelectorAll(".f09-tile")];
  const names = [...document.querySelectorAll(".f09-name")];
  gsap.set(".f09-line", { scaleX: 0 });
  gsap.set(tiles, { opacity: 0.35, scale: 0.94 });
  gsap.set(tiles.map((t) => t.querySelector("img")), { opacity: 0.45 });
  gsap.set(names, { opacity: 0 });
  gsap.set(".f09-eb", { opacity: 0, x: -12 });

  // ---- the route line runs under each row; each logo lights as the line reaches it (one hit per beat-eighth)
  tl.to(".f09-eb", { opacity: 1, x: 0, duration: 0.4, ease: "expo.out", stagger: 1.2 }, 0.0);
  tl.to("#f09-l1", { scaleX: 1, duration: 1.35, ease: "none" }, 0.025);
  tl.to("#f09-l2", { scaleX: 1, duration: 1.35, ease: "none" }, 1.225);
  const hits = [0.3, 0.6, 0.9, 1.2, 1.5, 1.8, 2.1, 2.4];
  tiles.forEach((tile, i) => {
    const t = hits[i];
    tl.to(tile, { opacity: 1, scale: 1, borderColor: "#3fb950", duration: 0.16, ease: "power2.out" }, t);
    tl.to(tile, { borderColor: "#3a3a3a", duration: 0.6, ease: "power2.out" }, t + 0.18);
    tl.to(tile.querySelector("img"), { opacity: 1, duration: 0.2, ease: "power2.out" }, t);
    tl.to(names[i], { opacity: 1, duration: 0.3, ease: "power2.out" }, t + 0.02);
  });

  // ---- 2.75–3.6  the grid dims; the route continues and carries the dot to where the logo will start
  tl.to("#f09-grid", { opacity: 0.12, duration: 0.6, ease: "power2.inOut" }, 2.8);
  const path = document.getElementById("f09-path");
  const PL = path.getTotalLength();
  gsap.set(path, { strokeDasharray: PL, strokeDashoffset: PL });
  const proxy = { p: 0 };
  const place = () => { const pt = path.getPointAtLength(PL * proxy.p); gsap.set("#f09-dot", { x: pt.x, y: pt.y }); };
  place();
  tl.to(path, { strokeDashoffset: 0, duration: 0.8, ease: "power2.inOut" }, 2.75);
  tl.to(proxy, { p: 1, duration: 0.8, ease: "power2.inOut", onUpdate: place }, 2.75);
  tl.to(path, { opacity: 0, duration: 0.3, ease: "power2.in" }, 3.3);

  window.__timelines[ID] = tl;
})();
