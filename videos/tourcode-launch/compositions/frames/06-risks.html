.steps.is-paused .step.is-current {
  background: none;
  box-shadow: inset 0 0 0 1px var(--accent);
}

.steps.is-paused .step.is-current .step-title {
  font-weight: normal;
}

.controls > .button {
  width: 100%;
}

/* Overview page in the editor area */



.overview-page {
  max-width: 960px;
  margin: 0 auto;
  padding: 40px 40px 56px;
  display: flex;
  flex-direction: column;
  gap: 24px;
}

.overview-header {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.overview-title {
  font-size: 26px;
  font-weight: 600;
  line-height: 1.25;
  letter-spacing: -0.01em;
  text-wrap: balance;
}

.overview-page .tour-question {
  font-size: 14px;
}

.overview-page .overview-summary {
  max-width: 72ch;
  font-size: 15px;
  line-height: 1.6;
  color: var(--vscode-foreground);
}

.overview-start {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 16px;
}

.button-large {
  padding: 9px 20px;
  font-size: 14px;
  font-weight: 600;
}

.button-large .icon {
  width: 16px;
  height: 16px;
}

.hint {
  font-size: 12px;
  color: var(--muted);
}

.route {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 4px 16px;
}

/* Explanation panel under the code */



.step-page {
  container-type: inline-size;
  padding: 12px 20px 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

/* A narrow panel shows one column, with the diagram right under the short text and before the
   button that opens the full explanation. A wide panel puts the diagram beside the text and lets
   the full explanation run across the whole width in columns: the bottom panel is wide but low. */
.step-page-body {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.step-page-main {
  display: contents;
}

.step-page-title {
  order: 1;
}

.step-page-lead {
  order: 2;
}

.step-page-stale,
.step-page-changed {
  order: 3;
}

.risk-list {
  order: 4;
}

.diagram-frame {
  order: 5;
}

.step-page-toggles,
.subtours {
  order: 6;
}

.details-body {
  order: 7;
}

.ask {
  order: 8;
}

@container (min-width: 760px) {
  .step-page-body {
    display: grid;
    grid-template-columns: minmax(280px, 1fr) minmax(0, max-content);
    grid-template-areas:
      "main diagram"
      "details details"
      "ask ask";
    align-items: start;
    gap: 14px 32px;
  }

  .step-page-main {
    grid-area: main;
    display: flex;
    flex-direction: column;
    gap: 12px;
    min-width: 0;
  }

  .diagram-frame {
    grid-area: diagram;
    min-width: 0;
  }

  .step-page-body.has-wide-diagram {
    grid-template-columns: minmax(0, 1fr);
    grid-template-areas:
      "main"
      "diagram"
      "details"
      "ask";
  }

  .ask {
    grid-area: ask;
  }

  .details-body {
    grid-area: details;
    column-width: 40ch;
    column-gap: 36px;
  }
}

.step-page-top {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: 8px 16px;
}

.step-page-meta {
  display: flex;
  align-items: baseline;
  gap: 12px;
  min-width: 0;
}

.step-page-place {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-family: var(--vscode-editor-font-family);
  font-size: 12px;
  color: var(--muted);
}

.step-page-controls {
  display: flex;
  gap: 8px;
}

.step-page-progress {
  grid-column: 1 / -1;
}

.step-page-title {
  font-size: 17px;
  font-weight: 600;
  line-height: 1.3;
  text-wrap: balance;
}

.step-page-lead {
  max-width: 75ch;
  font-size: 14px;
  line-height: 1.65;
}

.step-page-stale {
  padding: 8px 12px;
  border-radius: 6px;
  background: color-mix(in srgb, var(--vscode-editorWarning-foreground) 14%, transparent);
  color: var(--vscode-editorWarning-foreground);
}

.step-page-changed {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 8px 12px;
  border-radius: 6px;
  background: color-mix(in srgb, var(--vscode-editorWarning-foreground) 10%, transparent);
}

.step-page-changed-text {
  margin: 0;
  color: var(--vscode-editorWarning-foreground);
}

.step-page-changed-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 14px;
}

.step-page-changed-actions .link-button {
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.step-page-hint {
  margin-top: 4px;
}

.step-placeholder {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px 20px;
  color: var(--muted);
}

.step-placeholder-mark {
  display: grid;
  place-items: center;
  width: 32px;
  height: 32px;
  flex: none;
  border-radius: 10px;
  background: var(--accent-soft);
  color: var(--accent);
}

.details-toggle {
  align-self: flex-start;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 12px 5px 9px;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: var(--raised);
  color: var(--vscode-foreground);
  cursor: pointer;
}

.details-toggle:hover {
  border-color: var(--accent);
}

.details-toggle .icon {
  color: var(--accent);
}

.details-toggle.is-open .icon {
  transform: rotate(180deg);
}

.details-body {
  padding-left: 14px;
  border-left: 2px solid var(--accent);
  font-size: 13.5px;
  line-height: 1.7;
}

.markdown > * + * {
  margin-top: 10px;
}

.markdown p,
.markdown h3,
.markdown ul,
.markdown ol,
.markdown pre {
  margin: 0;
}

.markdown h3 {
  font-size: 13px;
  font-weight: 600;
}

.markdown ul,
.markdown ol {
  padding-left: 20px;
}

.markdown li + li {
  margin-top: 4px;
}

.markdown code {
  padding: 1px 5px;
  border-radius: 4px;
  background: var(--vscode-textCodeBlock-background, var(--raised));
  font-family: var(--vscode-editor-font-family);
  font-size: 0.92em;
}

.markdown pre {
  overflow-x: auto;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--vscode-textCodeBlock-background, var(--raised));
  line-height: 1.5;
}

.markdown pre code {
  padding: 0;
  background: none;
}

.markdown blockquote {
  margin: 0;
  padding: 8px 12px;
  border-left: 3px solid var(--vscode-editorWarning-foreground);
  border-radius: 0 6px 6px 0;
  background: color-mix(in srgb, var(--vscode-editorWarning-foreground) 10%, transparent);
}

.markdown-table {
  overflow-x: auto;
}

.markdown table {
  border-collapse: collapse;
  font-size: 12.5px;
  line-height: 1.5;
}

.markdown th,
.markdown td {
  padding: 4px 10px;
  border: 1px solid var(--border);
  text-align: left;
  vertical-align: top;
}

.markdown th {
  background: var(--raised);
  font-weight: 600;
}

.markdown pre,
.markdown blockquote,
.markdown-table {
  break-inside: avoid;
}

/* Step diagram */

.diagram-frame {
  overflow-x: auto;
}

.diagram {
  position: relative;
  display: flex;
  align-items: center;
  gap: 64px;
  width: max-content;
  margin-inline: auto;
  margin: 0;
  padding: 16px 18px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--raised);
}

.diagram-layer {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  gap: 12px;
  min-width: 0;
}

.diagram.is-vertical {
  flex-direction: column;
  gap: 36px;
  width: auto;
}

.diagram.is-vertical .diagram-layer {
  flex-direction: row;
  flex-wrap: wrap;
  justify-content: center;
}

.diagram-node {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 2px;
  max-width: 220px;
  padding: 7px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--surface);
  color: var(--vscode-foreground);
  font: inherit;
  text-align: left;
}

.diagram-node.is-link {
  cursor: pointer;
}

.diagram-node.is-link:hover {
  border-color: var(--accent);
}

.diagram-node.is-current {
  border-color: var(--accent);
  background: var(--accent-soft);
  box-shadow: 0 0 0 3px var(--accent-soft);
}

.diagram-node-label {
  font-family: var(--vscode-editor-font-family);
  font-size: 12.5px;
  font-weight: 600;
  overflow-wrap: break-word;
}

.diagram-node-note {
  font-size: 11.5px;
  color: var(--muted);
  overflow-wrap: break-word;
}

.diagram-node-here,
.diagram-node-step {
  position: absolute;
  top: -9px;
  right: 8px;
  padding: 0 6px;
  border-radius: 999px;
  font-size: 10px;
  font-weight: 600;
  line-height: 16px;
}

.diagram-node-here {
  background: var(--accent);
  color: var(--vscode-editor-background);
}

.diagram-node-step {
  background: var(--border);
  color: var(--vscode-foreground);
}

.diagram-edges {
  position: absolute;
  inset: 0;
  z-index: 0;
  width: 100%;
  height: 100%;
  overflow: visible;
  pointer-events: none;
}

.diagram-edge {
  fill: none;
  stroke: var(--muted);
  stroke-opacity: 0.6;
  stroke-width: 1.3;
}

.diagram-edge.is-active {
  stroke: var(--accent);
  stroke-opacity: 1;
  stroke-width: 1.6;
}

.diagram-arrow-head {
  fill: var(--muted);
  fill-opacity: 0.6;
}

.diagram-arrow-active-head {
  fill: var(--accent);
}

.diagram-edge-label {
  font-size: 11px;
  fill: var(--muted);
  paint-order: stroke;
  stroke: var(--raised);
  stroke-width: 4px;
  stroke-linejoin: round;
}

@media (prefers-reduced-motion: reduce) {
  :root {
    --motion: 0ms;
  }
}

/* Risks */

.risk-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.risk {
  --risk-color: var(--vscode-editorInfo-foreground);
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 6px 10px;
  border-left: 3px solid var(--risk-color);
  border-radius: 0 6px 6px 0;
  background: color-mix(in srgb, var(--risk-color) 9%, transparent);
}

.risk-high {
  --risk-color: var(--vscode-editorError-foreground);
}

.risk-medium {
  --risk-color: var(--vscode-editorWarning-foreground);
}

.risk-header {
  display: flex;
  align-items: baseline;
  gap: 10px;
}

.risk-title {
  color: var(--risk-color);
  font-size: 12px;
  font-weight: 600;
}

.risk-line {
  color: var(--muted);
  font-family: var(--vscode-editor-font-family);
  font-size: 11.5px;
}

.risk-text {
  font-size: 13px;
  line-height: 1.55;
}

.risk-marker {
  display: inline-block;
  width: 7px;
  height: 7px;
  margin-left: 6px;
  border-radius: 50%;
  background: var(--vscode-editorError-foreground);
  vertical-align: middle;
}

.step-page-toggles {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.risks-toggle {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 5px 12px 5px 8px;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: var(--raised);
  color: var(--vscode-foreground);
  cursor: pointer;
}

.risks-toggle:hover {
  border-color: var(--vscode-editorError-foreground);
}

.risks-toggle-switch {
  position: relative;
  width: 24px;
  height: 14px;
  border-radius: 999px;
  background: var(--border);
}

.risks-toggle-switch::after {
  content: "";
  position: absolute;
  top: 2px;
  left: 2px;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--vscode-foreground);
}

.risks-toggle.is-on .risks-toggle-switch {
  background: var(--vscode-editorError-foreground);
}

.risks-toggle.is-on .risks-toggle-switch::after {
  transform: translateX(10px);
}

/* Glossary */

/* The underline goes on the inner code too: a code background would hide the term's own line. */
.term,
.markdown .term > code {
  text-decoration: underline dotted var(--accent);
  text-underline-offset: 3px;
}

.term {
  position: relative;
  cursor: help;
}

.term-definition {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}

.term-tooltip {
  position: fixed;
  z-index: 100;
  display: none;
  box-sizing: border-box;
  width: max-content;
  max-width: min(340px, calc(100vw - 16px));
  overflow-y: auto;
  padding: 7px 10px;
  border: 1px solid var(--vscode-editorHoverWidget-border, var(--border));
  border-radius: 6px;
  background: var(--vscode-editorHoverWidget-background, var(--raised));
  color: var(--vscode-editorHoverWidget-foreground, var(--vscode-foreground));
  box-shadow: 0 4px 16px var(--vscode-widget-shadow, transparent);
  font-size: 12.5px;
  line-height: 1.5;
  pointer-events: none;
}

.term-tooltip.is-shown {
  display: block;
}

.glossary {
  display: grid;
  gap: 2px 0;
  margin: 0;
}

.glossary-term {
  margin-top: 8px;
  font-family: var(--vscode-editor-font-family);
  font-weight: 600;
}

.glossary-definition {
  margin: 0;
  color: var(--muted);
  line-height: 1.5;
}

/* Questions to Claude */

.ask {
  display: flex;
  flex-direction: column;
  gap: 12px;
  max-width: 100ch;
  padding-top: 12px;
  border-top: 1px solid var(--border);
}

.ask-exchange {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.ask-question {
  align-self: flex-start;
  max-width: 80ch;
  margin: 0;
  padding: 6px 12px;
  border-radius: 10px 10px 10px 2px;
  background: var(--accent-soft);
  font-weight: 500;
}

.ask-answer {
  font-size: 13.5px;
  line-height: 1.65;
}

.ask-status,
.build-status {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--muted);
  font-size: 12.5px;
}

.build-status {
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--raised);
}

.build-status-text {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}

.build-status-text strong {
  color: var(--vscode-foreground);
}

.build-status-reading,
.ask-status-text {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.ask-spinner {
  flex: none;
  width: 12px;
  height: 12px;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
}

@keyframes ask-spin {
  to {
    transform: rotate(360deg);
  }
}

@media (prefers-reduced-motion: reduce) {
  .ask-spinner {
  }
}

.ask-failure {
  margin: 0;
  padding: 8px 12px;
  border-radius: 6px;
  background: color-mix(in srgb, var(--vscode-editorError-foreground) 12%, transparent);
  color: var(--vscode-editorError-foreground);
}

.ask-form {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.ask-input {
  box-sizing: border-box;
  width: 100%;
  min-height: 52px;
  resize: vertical;
  padding: 8px 10px;
  border: 1px solid var(--vscode-input-border, var(--border));
  border-radius: 6px;
  background: var(--vscode-input-background);
  color: var(--vscode-input-foreground);
  font: inherit;
}

.ask-input:focus {
  outline: 1px solid var(--vscode-focusBorder);
  outline-offset: -1px;
}

.ask-actions {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.code-link {
  padding: 0;
  border: 0;
  background: none;
  color: var(--vscode-textLink-foreground);
  cursor: pointer;
}

.markdown .code-link code {
  text-decoration: underline;
  text-underline-offset: 2px;
}

/* Sub-tours */

.parent-trail {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px 10px;
  min-width: 0;
  padding: 6px 8px 6px 6px;
  border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--border));
  border-radius: 8px;
  background: var(--accent-soft);
  font-size: 12.5px;
}

.parent-trail-back {
  display: inline-flex;
  flex: none;
  align-items: center;
  gap: 5px;
  padding: 3px 10px 3px 7px;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: var(--surface);
  color: var(--vscode-foreground);
  font: inherit;
  cursor: pointer;
}

.parent-trail-back:hover {
  border-color: var(--accent);
}

.parent-trail-kind {
  flex: none;
  color: var(--accent);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.parent-trail-place {
  display: flex;
  flex: 1 1 180px;
  flex-wrap: wrap;
  gap: 2px 6px;
  min-width: 0;
  overflow: hidden;
  color: var(--muted);
  white-space: nowrap;
}

.parent-trail-tour,
.parent-trail-step {
  overflow: hidden;
  text-overflow: ellipsis;
}

.parent-trail-link {
  min-width: 0;
  max-width: 100%;
  padding: 0;
  border: 0;
  background: none;
  color: inherit;
  white-space: nowrap;
  cursor: pointer;
}

.parent-trail-link:hover {
  color: var(--vscode-textLink-activeForeground, var(--accent));
  text-decoration: underline;
  text-underline-offset: 2px;
}

.parent-trail-step {
  color: var(--vscode-foreground);
}

.subtours {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.subtours-title {
  margin: 4px 0 0;
  color: var(--muted);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.subtour-card {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 8px 12px 8px 10px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--raised);
  color: var(--vscode-foreground);
  font: inherit;
  text-align: left;
  cursor: pointer;
}

.subtour-card:hover {
  border-color: var(--accent);
  background: var(--accent-soft);
}

.subtour-card.is-new {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}

.subtour-card-mark {
  display: grid;
  flex: none;
  place-items: center;
  width: 26px;
  height: 26px;
  border-radius: 7px;
  background: var(--accent-soft);
  color: var(--accent);
}

.subtour-card-text {
  display: flex;
  flex: 1;
  flex-direction: column;
  gap: 1px;
  min-width: 0;
}

.subtour-card-title {
  overflow: hidden;
  font-weight: 600;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.subtour-card-meta {
  color: var(--muted);
  font-size: 12px;
}

.subtour-card-new {
  flex: none;
  padding: 1px 7px;
  border-radius: 999px;
  background: var(--accent);
  color: var(--vscode-editor-background);
  font-size: 10.5px;
  font-weight: 600;
}

.subtour-card-enter {
  display: inline-flex;
  flex: none;
  align-items: center;
  gap: 4px;
  color: var(--accent);
  font-weight: 600;
}

.subtour-count {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  margin-left: 6px;
  color: var(--accent);
  font-size: 11px;
  font-weight: 600;
  vertical-align: middle;
}

.subtour-count svg {
  width: 12px;
  height: 12px;
}

.subtour-busy {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  max-width: 100%;
  padding: 5px 6px 5px 11px;
  border: 1px solid var(--accent);
  border-radius: 999px;
  background: var(--accent-soft);
}

.subtour-busy-text {
  display: flex;
  flex-direction: column;
  min-width: 0;
  line-height: 1.25;
}

.subtour-busy-title {
  font-weight: 600;
}

.subtour-busy-reading {
  overflow: hidden;
  color: var(--muted);
  font-size: 11.5px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.subtour-busy-stop {

/* Sections fold like folders in the explorer. */
.section-header {

  flex: 1;
