<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TourCode</title>
<style>
:root {
  --bg: #f4f6f8;
  --surface: #ffffff;
  --fg: #17202c;
  --muted: #5a6575;
  --line: #d3dae3;
  --highlight: #fbe6a2;
  --highlight-edge: #c2931a;
  --accent: #17202c;
  --accent-fg: #ffffff;
  --risk-high: #d1242f;
  --risk-medium: #9a6700;
  --risk-low: #0969da;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f141b;
    --surface: #161c25;
    --fg: #e4e9f0;
    --muted: #94a1b2;
    --line: #2a3442;
    --highlight: #4a3a10;
    --highlight-edge: #e2b43f;
    --accent: #e4e9f0;
    --accent-fg: #0f141b;
    --risk-high: #f47067;
    --risk-medium: #d4a72c;
    --risk-low: #58a6ff;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font: 15px/1.6 var(--sans); }
#app { height: 100%; display: flex; flex-direction: column; }

.header { display: flex; align-items: baseline; gap: 16px; padding: 14px 24px; border-bottom: 1px solid var(--line); background: var(--surface); }
.header-title { margin: 0; font-size: 18px; font-weight: 650; }
.header-counter { color: var(--muted); font-size: 14px; }

.layout { flex: 1; min-height: 0; display: grid; grid-template-columns: 260px minmax(0, 1fr); }
.step-list { overflow-y: auto; padding: 16px 12px; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; }
.step-list-title { margin: 0 8px 8px; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.step-list-item { text-align: left; background: none; border: 0; border-radius: 6px; padding: 7px 10px; color: var(--fg); font: inherit; font-size: 14px; cursor: pointer; }
.step-list-item:hover { background: var(--line); }
.step-list-item.is-current { background: var(--highlight); box-shadow: inset 3px 0 0 var(--highlight-edge); }

.overview { overflow-y: auto; padding: 32px 40px; max-width: 860px; display: flex; flex-direction: column; gap: 16px; }
.overview-question { margin: 0; color: var(--muted); font-size: 14px; }
.overview-summary { margin: 0; font-size: 18px; max-width: 65ch; }
.overview-nodes { display: flex; flex-wrap: wrap; gap: 10px; }
.overview-node { padding: 10px 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--fg); font: inherit; cursor: pointer; }
.overview-node:hover { border-color: var(--highlight-edge); }
.overview-edges { margin: 0; padding-left: 20px; color: var(--muted); }

.step { min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }
.step-file { padding: 10px 24px; font: 13px var(--mono); color: var(--muted); border-bottom: 1px solid var(--line); }
.code { overflow: auto; padding: 8px 0; font: 13px/1.65 var(--mono); background: var(--surface); }
.code-line { display: flex; white-space: pre; }
.code-line.is-highlighted { background: var(--highlight); box-shadow: inset 4px 0 0 var(--highlight-edge); }
.code-line-number { flex: none; width: 56px; padding-right: 16px; text-align: right; color: var(--muted); user-select: none; }
.code-line-text { padding-right: 24px; }

.step-card { padding: 18px 24px; border-top: 1px solid var(--line); background: var(--bg); display: flex; flex-direction: column; gap: 8px; max-height: 45vh; overflow-y: auto; }
.step-card-title { margin: 0; font-size: 17px; }
.step-card:has(.details-body) { max-height: 65vh; }
.step-card-text { max-width: 75ch; }
.step-card-actions { display: flex; gap: 10px; margin-top: 4px; }

.markdown > * { margin: 0 0 8px; }
.markdown > :last-child { margin-bottom: 0; }
.markdown ul, .markdown ol { padding-left: 22px; }
.markdown h3 { font-size: 15px; margin-top: 14px; }
.markdown code { font: 0.9em var(--mono); padding: 1px 5px; border-radius: 4px; background: var(--surface); border: 1px solid var(--line); }
.markdown pre { overflow-x: auto; padding: 10px 14px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line); }
.markdown pre code { padding: 0; border: 0; background: none; font-size: 13px; }

.markdown blockquote { margin: 0 0 8px; padding: 8px 12px; border-left: 3px solid var(--highlight-edge); border-radius: 0 6px 6px 0; background: var(--surface); }
.markdown-table { overflow-x: auto; }
.markdown table { border-collapse: collapse; font-size: 13px; }
.markdown th, .markdown td { padding: 4px 10px; border: 1px solid var(--line); text-align: left; vertical-align: top; }
.markdown th { background: var(--surface); }

.diagram-frame { overflow-x: auto; }
.diagram { position: relative; display: flex; align-items: center; gap: 64px; width: max-content; margin-inline: auto; margin: 4px 0; padding: 14px 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.diagram-layer { position: relative; z-index: 1; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.diagram-node { position: relative; display: flex; flex-direction: column; gap: 2px; max-width: 220px; padding: 7px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg); font: inherit; text-align: left; }
.diagram-node.is-link { cursor: pointer; }
.diagram-node.is-link:hover { border-color: var(--highlight-edge); }
.diagram-node.is-current { border-color: var(--highlight-edge); background: var(--highlight); }
.diagram-node-label { font: 600 13px var(--mono); overflow-wrap: break-word; }
.diagram-node-note { font-size: 12px; color: var(--muted); overflow-wrap: break-word; }
.diagram-node-here { position: absolute; top: -9px; right: 8px; padding: 0 6px; border-radius: 999px; background: var(--highlight-edge); color: var(--bg); font-size: 10px; font-weight: 600; line-height: 16px; }
.diagram-edges { position: absolute; inset: 0; z-index: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
.diagram-edge { fill: none; stroke: var(--muted); stroke-width: 1.3; }
.diagram-arrow-head { fill: var(--muted); }
.diagram-edge-label { font-size: 11px; fill: var(--muted); paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; }
.diagram.is-vertical { flex-direction: column; gap: 36px; width: auto; }
.diagram.is-vertical .diagram-layer { flex-direction: row; flex-wrap: wrap; justify-content: center; }

.risk-list { display: flex; flex-direction: column; gap: 6px; margin: 0; padding: 0; list-style: none; }
.risk { --risk-color: var(--risk-low); display: flex; flex-direction: column; gap: 2px; padding: 6px 10px; border-left: 3px solid var(--risk-color); border-radius: 0 6px 6px 0; background: color-mix(in srgb, var(--risk-color) 10%, transparent); }
.risk-high { --risk-color: var(--risk-high); }
.risk-medium { --risk-color: var(--risk-medium); }
.risk-header { display: flex; align-items: baseline; gap: 10px; }
.risk-title { color: var(--risk-color); font-size: 12px; font-weight: 650; }
.risk-line { color: var(--muted); font: 12px var(--mono); }
.risk-text { font-size: 14px; }
.code-line.has-risk .code-line-text { text-decoration: underline wavy var(--risk-medium); text-underline-offset: 4px; }
.code-line.has-risk.risk-high .code-line-text { text-decoration-color: var(--risk-high); }
.code-line.has-risk.risk-low .code-line-text { text-decoration-color: var(--risk-low); }

.term, .term > code { text-decoration: underline dotted var(--highlight-edge); text-underline-offset: 3px; }
.term { position: relative; cursor: help; }
.term-definition { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.term-tooltip { position: fixed; z-index: 100; display: none; box-sizing: border-box; width: max-content; max-width: min(340px, calc(100vw - 16px)); overflow-y: auto; padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--fg); font: 13px/1.5 var(--sans); box-shadow: 0 4px 16px rgb(0 0 0 / 0.2); pointer-events: none; }
.term-tooltip.is-shown { display: block; }

.details { display: flex; flex-direction: column; gap: 10px; }
.details-toggle { align-self: flex-start; padding: 4px 0; border: 0; background: none; color: var(--fg); font: inherit; font-size: 14px; font-weight: 600; text-decoration: underline; text-decoration-color: var(--highlight-edge); text-underline-offset: 4px; cursor: pointer; }
.details-body { max-width: 75ch; padding-left: 14px; border-left: 3px solid var(--highlight-edge); }

.primary-button, .secondary-button { align-self: flex-start; padding: 8px 18px; border-radius: 8px; font: inherit; font-size: 14px; cursor: pointer; }
.primary-button { background: var(--accent); color: var(--accent-fg); border: 1px solid var(--accent); }
.secondary-button { background: none; color: var(--fg); border: 1px solid var(--line); }
button:focus-visible { outline: 2px solid var(--highlight-edge); outline-offset: 2px; }

@media (max-width: 760px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .step-list { display: none; }
}
</style>
</head>

<script type="application/json" id="tour-page">{"tour":{"id":"how-login-works","title":"How login works","question":"how does login work in this project?","language":"en","audience":"developer","overview":{"summary":"Login is driven by handleLogin: it looks up the user by email, verifies the password against the stored hash, and on success issues a session. If the user is missing or the password is wrong, it returns a generic failure reason instead.","nodes":[{"id":"handle","label":"handleLogin(email, password)","note":"entry point in auth.ts","step":"handle-login"},{"id":"find","label":"findUser(email)","note":"lookup by email","step":"find-user"},{"id":"verify","label":"verifyPassword(password, hash)","note":"hash compare","step":"verify-password"},{"id":"session","label":"startSession(userId)","note":"issues token","step":"start-session"}],"edges":[{"from":"handle","to":"find","label":"email"},{"from":"find","to":"verify","label":"user.passwordHash"},{"from":"verify","to":"session","label":"if password ok"}]},"glossary":[{"term":"handleLogin","definition":"The entry point of login: it takes an email and password and returns either a failure reason or a new session."},{"term":"passwordHash","definition":"The stored, hashed form of a user's password. The login never compares plain passwords, only hashes."},{"term":"verifyPassword","definition":"Hashes the submitted password and checks whether it equals the stored hash."},{"term":"startSession","definition":"Creates a session object with the user id, a start timestamp and a random token after a successful login."},{"term":"findUser","definition":"Looks up a user by email. Here it searches a hard-coded in-memory array."}],"steps":[{"id":"handle-login","title":"The login entry point","file":"src/auth.ts","lines":{"start":4,"end":10},"anchor":"export async function handleLogin(email: string, password: string) {","text":"handleLogin is where login begins. It finds the user by email, rejects the attempt if the user is missing or the password is wrong, and otherwise returns a new session.","details":"`handleLogin` is the single public function that drives login. It takes two strings, `email` and `password`, straight from the caller.\n\nStep by step:\n\n1. `const user = await findUser(email)` looks up the account by email (next step).\n2. The guard on line 6 combines two checks with `||`: `user === undefined` (no such email) and `!verifyPassword(password, user.passwordHash)` (wrong password). Thanks to short-circuit evaluation, if `user` is `undefined` the second half never runs, so `user.passwordHash` is safe.\n3. On failure it returns `{ ok: false, reason: \"Wrong email or password\" }` — one generic reason for both cases, so an attacker can't tell whether the email exists.\n4. On success it returns `{ ok: true, session: startSession(user.id) }`, passing the user id into session creation.\n\nThe shape of the return value is a small discriminated result: callers check `ok` before reading `session` or `reason`.\n\n> The function returns a result object instead of throwing; a caller that forgets to check `ok` would treat a failed login as success.","diagram":{"nodes":[{"id":"handle","label":"handleLogin","note":"email, password","step":"handle-login"},{"id":"find","label":"findUser","note":"returns user | undefined","step":"find-user"},{"id":"verify","label":"verifyPassword","step":"verify-password"},{"id":"session","label":"startSession","step":"start-session"}],"edges":[{"from":"handle","to":"find","label":"email"},{"from":"find","to":"verify","label":"passwordHash"},{"from":"verify","to":"session","label":"ok → user.id"}]},"risks":[{"level":"low","kind":"contract","line":6,"text":"verifyPassword returns a boolean synchronously; this guard relies on that (no await). If verifyPassword became async the ! would always be false and the guard would silently pass."}],"suggestedQuestions":["Why return a result object instead of throwing an error?","Why is the failure reason the same for a missing user and a wrong password?","Who calls handleLogin?"],"fingerprint":["bb46839f","e00d7edd","57ea4fd5","96dc6da7","f80c48a8","65df010e","f80c48a8"]},{"id":"find-user","title":"Looking up the user by email","file":"src/auth.ts","lines":{"start":12,"end":15},"anchor":"async function findUser(email: string) {","text":"findUser resolves an email to a user record. Here the \"database\" is a single hard-coded array, and it returns the first match or undefined.","details":"`findUser` is a private helper (not exported) that stands in for a database query. It is `async` so that `handleLogin` can `await` it, even though this implementation does no real I/O.\n\n- Line 13 defines `users`, an in-memory array with one record: `{ id, email, passwordHash }`. The password hash `\"x1y2\"` is already stored in hashed form, never as plain text.\n- Line 14 uses `Array.find` to return the first user whose `email` matches. If none match, `find` returns `undefined`, which is exactly the value `handleLogin`'s guard checks for.\n\nSo the output is either a user object carrying `passwordHash`, or `undefined`. That `passwordHash` is what flows into the next step.\n\nIn a real app this is where you'd query a users table; the rest of the login flow would stay the same as long as the returned shape (`id` and `passwordHash`) is preserved.","diagram":{"nodes":[{"id":"email","label":"email","note":"e.g. a@b.c"},{"id":"find","label":"users.find(...)","step":"find-user"},{"id":"out","label":"user | undefined","note":"has id, passwordHash"}],"edges":[{"from":"email","to":"find","label":"match by email"},{"from":"find","to":"out","label":"first match"}]},"risks":[{"level":"medium","kind":"other","line":13,"text":"User data is hard-coded in the function, so every login scans a fixed array and no real accounts exist. This is a stub, not production storage."}],"suggestedQuestions":["How would this change with a real database?","What fields must the user object have for login to work?","Is the email match case-sensitive?"],"fingerprint":["79186342","c8aee9ff","4f82f18e","f80c48a8"]},{"id":"verify-password","title":"Verifying the password","file":"src/password.ts","lines":{"start":1,"end":7},"anchor":"export function verifyPassword(password: string, hash: string): boolean {","text":"verifyPassword hashes the submitted password and compares it to the stored hash. It never compares plain text, and returns true only when the hashes match.","details":"This file holds the password logic that `handleLogin` depends on.\n\n- `verifyPassword(password, hash)` (line 1) hashes the incoming `password` with `hashPassword` and compares the result to the stored `hash` using `===`. It returns a plain `boolean` — the value `handleLogin` negates with `!` in its guard.\n- `hashPassword` (line 5) is the hashing scheme: it reverses the characters of the string (`split(\"\").reverse().join(\"\")`). So `\"2y1x\"` hashes to `\"x1y2\"`, matching the stored hash from `findUser`.\n\nThe key idea: login compares *hashes*, not raw passwords. Only the hash is stored, and the submitted password is hashed the same way before comparison.\n\n> The hashing here is a toy (string reversal) and is trivially reversible — fine for a demo, but a real system must use a one-way, salted algorithm such as bcrypt or argon2.","diagram":{"nodes":[{"id":"pw","label":"password","note":"plain text in"},{"id":"hash","label":"hashPassword","note":"reverse string","step":"verify-password"},{"id":"cmp","label":"=== hash","note":"stored passwordHash"},{"id":"out","label":"boolean"}],"edges":[{"from":"pw","to":"hash","label":"hash it"},{"from":"hash","to":"cmp","label":"computed hash"},{"from":"cmp","to":"out","label":"match?"}]},"risks":[{"level":"high","kind":"security","line":6,"text":"hashPassword just reverses the string, so the stored hash is trivially reversible to the original password. Not safe for real credentials."},{"level":"low","kind":"other","line":2,"text":"The === comparison is not constant-time, which
